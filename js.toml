# Syntax configuration for JavaScript files.
#
# Regular expressions must conform to the syntax supported by regex-lite.
# https://docs.rs/regex-lite/latest/regex_lite/index.html

[syntax]
name = "JavaScript"
files = ['\.(m|c)?js$']

[tokens]
# Reserved words
'\b(?:as|async|await|break|case|catch|class|const|continue|default|delete|do|else|export|extends|false|finally|for|from|function|get|if|import|in|instanceof|let|new|null|of|return|set|switch|this|throw|true|try|typeof|undefined|var|void|while|with|yield)\b' = "orchid-bloom"

# Subset of operators
'=>' = "misty-aqua"

# Types
'\b(?:[A-Z][a-z]*)+\b' = "deep-sapphire"

# Decimal numbers
'\b[+-]?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b' = "verdant-spring"

# Hex/Octal/Binary numbers
'\b0[xX][\dA-Fa-f]+\b' = "verdant-spring"
'\b0[oO][0-7]+\b' = "verdant-spring"
'\b0[bB][01]+\b' = "verdant-spring"

# Normal strings
'"(?:\\.|[^"\\\n])*"' = "peachy-orange"
"'(?:\\\\.|[^'\\\\\\n])*'" = "peachy-orange"

# Template literal strings
'`(?:\\.|[^`\\])*`' = "seafoam-mist"

# Comments
'//.*$' = "sage-green"
'/\*[\s\S]*?\*/' = "sage-green"
